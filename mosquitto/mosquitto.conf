# Minimal Mosquitto broker config for local development.
#
# allow_anonymous true: the broker itself does NOT authenticate
# connections. Authentication happens one layer up, at the application
# level, inside telemetry-service's message handler - it checks each
# reading's ingestion_key against the same IngestionKey table used for
# HTTP ingestion (see design rationale: avoids maintaining two separate
# credential systems that could drift out of sync).
#
# SECURITY NOTE: this is fine for local development on an isolated
# Docker network, but before any real customer traffic touches this,
# the broker itself should also require a username/password or TLS
# client certs, plus topic-level ACLs - right now anything that can
# reach port 1883 can publish or subscribe to ANY topic, not just its
# own device's. Tracked as a TECH_DEBT item, not fixed yet.

listener 1883
allow_anonymous true

persistence false
log_dest stdout
