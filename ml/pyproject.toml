[project]
name = "ml"
version = "0.1.0"
description = "ML/data-science work for HVAC fault detection - not a deployed service"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2.3,<3.0.0)",
    "numpy (>=2.1.0,<3.0.0)",
    "matplotlib (>=3.9.0,<4.0.0)",
    "ipykernel (>=6.29.0,<7.0.0)",
    "scikit-learn (>=1.5.2,<2.0.0)",
    "joblib (>=1.5.3,<2.0.0)",
    "xgboost (>=3.3.0,<4.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Deliberately lighter than every services/*/pyproject.toml - this
# project explicitly isn't a deployed service (see its own description
# above) and contains genuine research/exploratory code (training,
# algorithm-comparison scripts) alongside the smaller "production"
# subset ml-service actually imports at runtime (inference.py,
# live_features.py). Full disallow_untyped_defs strictness would either
# require retrofitting exploratory scripts that were never meant to be
# typed that way, or produce a wave of pointless suppressions - neither
# is real engineering judgment, just applying a rule uniformly where it
# doesn't fit.
