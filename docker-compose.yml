version: "3.9"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: hvac
      POSTGRES_PASSWORD: hvac_dev_password
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hvac -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ping -q 0 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hvac:hvac_dev_password@postgres:5432/auth_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in a root .env file - no safe default, this is a real secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  asset-service:
    build:
      context: .
      dockerfile: services/asset-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hvac:hvac_dev_password@postgres:5432/asset_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in a root .env file - no safe default, this is a real secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:8000
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  telemetry-service:
    build:
      context: .
      dockerfile: services/telemetry-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hvac:hvac_dev_password@postgres:5432/telemetry_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in a root .env file - no safe default, this is a real secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      AUTH_SERVICE_URL: http://auth-service:8000
      ASSET_SERVICE_URL: http://asset-service:8001
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      asset-service:
        condition: service_healthy

  ml-service:
    build:
      context: .
      dockerfile: services/ml-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hvac:hvac_dev_password@postgres:5432/ml_service_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in a root .env file - no safe default, this is a real secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ASSET_SERVICE_URL: http://asset-service:8001
      TELEMETRY_SERVICE_URL: http://telemetry-service:8002
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in a root .env file - no safe default, this is a real secret}
      AUTH_SERVICE_URL: http://auth-service:8000
      SCHEDULER_SERVICE_ACCOUNT_EMAIL: ${SCHEDULER_SERVICE_ACCOUNT_EMAIL:-ml-scheduler-service@hvacfddpro.com}
      SCHEDULER_SERVICE_ACCOUNT_PASSWORD: ${SCHEDULER_SERVICE_ACCOUNT_PASSWORD:?SCHEDULER_SERVICE_ACCOUNT_PASSWORD must be set in a root .env file - no safe default, this is a real secret}
      SCHEDULER_INTERVAL_SECONDS: 60
      MODELS_DIR: /ml/models
      ML_SRC_DIR: /ml
    volumes:
      - ./ml:/ml:ro
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      asset-service:
        condition: service_healthy
      telemetry-service:
        condition: service_started
      notification-service:
        condition: service_started
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hvac:hvac_dev_password@postgres:5432/notification_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in a root .env file - no safe default, this is a real secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ASSET_SERVICE_URL: http://asset-service:8001
      TELEMETRY_SERVICE_URL: http://telemetry-service:8002
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY must be set in a root .env file - no safe default, this is a real secret}
    ports:
      - "8004:8004"
    depends_on:
      postgres:
        condition: service_healthy
      asset-service:
        condition: service_healthy
      telemetry-service:
        condition: service_started
  copilot-service:
    build:
      context: .
      dockerfile: services/copilot-service/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://hvac:hvac_dev_password@postgres:5432/copilot_service_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in a root .env file - no safe default, this is a real secret}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      ASSET_SERVICE_URL: http://asset-service:8001
      TELEMETRY_SERVICE_URL: http://telemetry-service:8002
      ML_SERVICE_URL: http://ml-service:8003
      NOTIFICATION_SERVICE_URL: http://notification-service:8004
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set in a root .env file - no safe default, this is a real secret}
      CHROMA_PERSIST_DIR: /app/data/chroma
    volumes:
      - chroma_data:/app/data/chroma
      - ./services/copilot-service/data/source_docs:/app/data/source_docs:ro
    ports:
      - "8005:8005"
    depends_on:
      postgres:
        condition: service_healthy
      asset-service:
        condition: service_healthy
volumes:
  pgdata:
  chroma_data:
