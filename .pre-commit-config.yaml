repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Raised from 1000KB: copilot-service's RAG knowledge base
        # needs real technical PDF source documents (a real 68-page
        # ASME paper is 1.7MB) - still low enough to catch genuine
        # accidents (e.g. model weights, datasets), just not so low it
        # blocks realistic reference documents.
        args: ['--maxkb=3000']
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        name: mypy (auth-service)
        files: ^services/auth-service/
        args: [--config-file=services/auth-service/pyproject.toml]
        additional_dependencies: [pydantic]
      - id: mypy
        name: mypy (asset-service)
        files: ^services/asset-service/
        # Test functions and pytest fixtures are conventionally left
        # untyped (signatures carry little type-safety value, fixtures
        # are dynamically injected by pytest) - excluded the same way
        # ml-service/notification-service/copilot-service already
        # exclude their alembic/ directories below. This exclude has
        # to live HERE, not in pyproject.toml's [tool.mypy] exclude,
        # for the same reason documented on those alembic excludes:
        # pre-commit passes specific changed file paths directly as
        # arguments, bypassing pyproject.toml's exclude entirely.
        exclude: ^services/asset-service/tests/
        args: [--config-file=services/asset-service/pyproject.toml]
        additional_dependencies: [pydantic]
      - id: mypy
        name: mypy (common)
        files: ^libs/common/
        args: [--config-file=libs/common/pyproject.toml]
        additional_dependencies: [pydantic]
      - id: mypy
        name: mypy (ml-service)
        files: ^services/ml-service/
        # pyproject.toml's [tool.mypy] exclude only applies when mypy
        # does its own recursive directory discovery - pre-commit passes
        # specific changed file paths directly as arguments, which
        # bypasses that setting entirely (a known mypy behavior, not a
        # config mistake). The exclude has to live here instead.
        exclude: ^services/ml-service/alembic/
        args: [--config-file=services/ml-service/pyproject.toml]
        additional_dependencies: [pydantic]
      - id: mypy
        name: mypy (notification-service)
        files: ^services/notification-service/
        # Excludes both alembic/ (auto-generated migrations, not worth
        # annotating) and tests/ (test functions and pytest fixtures
        # are conventionally left untyped - same reasoning already
        # applied to asset-service's tests/ exclude above).
        exclude: ^services/notification-service/(alembic|tests)/
        args: [--config-file=services/notification-service/pyproject.toml]
        additional_dependencies: [pydantic]
      - id: mypy
        name: mypy (copilot-service)
        files: ^services/copilot-service/
        exclude: ^services/copilot-service/alembic/
        args: [--config-file=services/copilot-service/pyproject.toml]
        additional_dependencies: [pydantic]
