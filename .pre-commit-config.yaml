repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        # Raised from 1000KB: copilot-service's RAG knowledge base
        # needs real technical PDF source documents (a real 68-page
        # ASME paper is 1.7MB) - still low enough to catch genuine
        # accidents (e.g. model weights, datasets), just not so low it
        # blocks realistic reference documents.
        args: ['--maxkb=3000']
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  # Local hooks, not mirrors-mypy: mirrors-mypy runs mypy inside an
  # isolated virtualenv containing ONLY `additional_dependencies` (here,
  # just pydantic) - none of sqlalchemy/python-jose/passlib/httpx/common
  # (this repo's own shared local package) were ever actually resolvable
  # there. Since every service's pyproject.toml also sets
  # ignore_missing_imports = true, those unresolvable imports silently
  # degraded to `Any` instead of erroring - which is what was masking
  # this for a long time (see docs/TECH_DEBT.md's mypy backlog entries).
  # These hooks instead invoke each project's OWN real Poetry
  # environment (already correctly set up with every real dependency,
  # including the editable `common` path dependency, which Poetry
  # already handles natively) - `poetry -C <dir> run mypy <target>` runs
  # against the real, fully-installed venv, the same one `poetry run
  # mypy` already gives a developer locally. This also means each
  # pyproject.toml's own [tool.mypy] `exclude` (e.g. ml/'s research-
  # script exclusions) is honored automatically, since mypy is doing its
  # own recursive discovery from a package/directory target here instead
  # of pre-commit handing it a list of individually changed file paths.
  #
  # Requires each project's dependencies to already be installed (`poetry
  # install` in that directory) for the hook to find a real venv to run
  # in - true for any of these directories a developer has actually
  # worked in locally. ml-service and copilot-service are the one real
  # exception on this Windows dev machine specifically: their `poetry
  # install` can't complete locally (chroma-hnswlib/shap need MSVC Build
  # Tools, not installed here - see docs/TECH_DEBT.md) - use `docker
  # compose exec <service> poetry run mypy app --config-file=pyproject.toml`
  # instead when checking those two locally. CI installs every service
  # directly via `poetry install` on ubuntu-latest, which has prebuilt
  # wheels for both and hits neither issue.
  - repo: local
    hooks:
      - id: mypy-auth-service
        name: mypy (auth-service)
        entry: poetry -C services/auth-service run mypy app --config-file=pyproject.toml
        language: system
        files: ^services/auth-service/
        pass_filenames: false
      - id: mypy-asset-service
        name: mypy (asset-service)
        entry: poetry -C services/asset-service run mypy app --config-file=pyproject.toml
        language: system
        files: ^services/asset-service/
        pass_filenames: false
      - id: mypy-telemetry-service
        name: mypy (telemetry-service)
        entry: poetry -C services/telemetry-service run mypy app --config-file=pyproject.toml
        language: system
        files: ^services/telemetry-service/
        pass_filenames: false
      - id: mypy-notification-service
        name: mypy (notification-service)
        entry: poetry -C services/notification-service run mypy app --config-file=pyproject.toml
        language: system
        files: ^services/notification-service/
        pass_filenames: false
      - id: mypy-ml-service
        name: mypy (ml-service)
        # See the Windows caveat in this repo section's header comment -
        # local poetry install fails here specifically; use
        # `docker compose exec ml-service poetry run mypy app
        # --config-file=pyproject.toml` to check this one locally.
        entry: poetry -C services/ml-service run mypy app --config-file=pyproject.toml
        language: system
        files: ^services/ml-service/
        pass_filenames: false
      - id: mypy-copilot-service
        name: mypy (copilot-service)
        # Same Windows-local caveat as ml-service above - use
        # `docker compose exec copilot-service poetry run mypy app
        # --config-file=pyproject.toml` here instead.
        entry: poetry -C services/copilot-service run mypy app --config-file=pyproject.toml
        language: system
        files: ^services/copilot-service/
        pass_filenames: false
      - id: mypy-common
        name: mypy (common)
        entry: poetry -C libs/common run mypy common --config-file=pyproject.toml
        language: system
        files: ^libs/common/
        pass_filenames: false
      - id: mypy-ml
        name: mypy (ml)
        entry: poetry -C ml run mypy . --config-file=pyproject.toml
        language: system
        files: ^ml/
        pass_filenames: false
