[project]
name = "copilot-service"
version = "0.1.0"
description = "HVAC-FDD Pro: RAG + tool-calling AI copilot"
authors = [
    {name = "sreehari-sreesunil",email = "sreeharisunil2@gmail.com"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "fastapi (>=0.140.0,<0.141.0)",
    "uvicorn[standard] (>=0.51.0,<0.52.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "chromadb (>=0.5.20,<0.6.0)",
    "sentence-transformers (>=3.3.1,<4.0.0)",
    "groq (>=0.13.0,<1.0.0)",
    "pypdf (>=5.1.0,<6.0.0)",
    "common"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
common = {path = "../../libs/common", develop = true}

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "deepeval (>=2.9.0,<3.0.0)",
    "litellm (>=1.55.0,<2.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
exclude = ["^alembic/"]
