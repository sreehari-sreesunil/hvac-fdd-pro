[project]
name = "common"
version = "0.1.0"
description = "Shared utilities for HVAC platform microservices"
authors = [
    {name = "you",email = "you@example.com"}
]
requires-python = ">=3.10"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "structlog (>=26.1.0,<27.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.2.0,<3.0.0)",
    "types-python-jose (>=3.5.0.20260408,<4.0.0.0)"
]

[tool.pytest.ini_options]
addopts = "--cov=common --cov-report=term-missing"
testpaths = ["tests"]
